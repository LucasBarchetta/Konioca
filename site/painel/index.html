<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Konioca · Painel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/img/favicon.png"><link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&amp;family=Carlito:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="../assets/css/site.css?v=0110g">
<link rel="stylesheet" href="../assets/css/painel.css?v=0110g">
</head><body class="painel">
<div id="p-restrito" class="p-restrito">Acesso restrito</div>
<div id="p-app" class="oculto">
<header class="p-topo">
  <img src="../assets/img/logo_konioca_branco.png" alt="Konioca">
  <div class="p-quem"><div id="p-nome">Painel</div><div id="p-papel" class="p-sub">carregando…</div><div id="p-atualizado" class="p-sub"></div></div>
  <div class="p-placar"><div id="p-placar-num">—</div><div class="p-sub">de <span id="p-placar-lote">250</span> reservadas</div></div>
</header>
<main class="p-main">
  <div id="p-erro" class="form-erro oculto" role="alert"></div>
  <nav class="p-abas" id="p-abas">
    <button type="button" data-aba="leads" class="ativa">Leads</button>
    <button type="button" data-aba="aprovacoes">Aprovações <span id="p-aprov-n" class="p-badge oculto">0</span></button>
  </nav>

  <section id="aba-leads">
    <div class="p-filtros" id="p-filtros">
      <button type="button" data-filtro="todos" class="ativa">Todos</button>
      <button type="button" data-filtro="pode_cobrar">Pode cobrar</button>
      <button type="button" data-filtro="sem_circular">Sem Circular</button>
      <button type="button" data-filtro="reservados">Reservados</button>
      <button type="button" data-filtro="contatados">Contatados à mão</button>
      <button type="button" data-filtro="sairam">Saíram</button>
      <button type="button" data-filtro="base_antiga">Base antiga</button>
    </div>
    <div class="p-filtros p-canais" id="p-canais" aria-label="Filtrar por canal de origem"></div>
    <div class="p-filtros p-temps" id="p-temps" aria-label="Filtrar por temperatura"></div>
    <input id="p-busca" type="search" placeholder="Buscar por nome, cidade, e-mail ou WhatsApp" autocomplete="off">
    <div id="p-resumo" class="p-sub"></div>
    <div id="p-lista" class="p-lista"></div>
  </section>

  <section id="aba-aprovacoes" class="oculto">
    <div id="p-aprovacoes" class="p-lista"></div>
  </section>
</main>
<p class="p-rodape">Painel da pré-venda · Fase A. Toda ação fica registrada com o seu nome. Não repasse o seu link.</p>
</div>
<script src="../assets/js/env.js?v=0110g"></script>
<script src="../assets/js/painel.js?v=0110g"></script>
</body></html>
